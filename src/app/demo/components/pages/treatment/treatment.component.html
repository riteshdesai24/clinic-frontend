<div class="grid"><div class="col-12"><div class="pf-card">
  <div class="pf-header"><div class="pf-icon"><i class="pi pi-heart"></i></div><div><h5 class="pf-title">{{ isEdit ? 'Edit Treatment' : 'Create Treatment' }}</h5><p class="pf-sub">Fill in the treatment details below</p></div></div>
  <form [formGroup]="form" (ngSubmit)="save()">
    <p class="section-label">Clinic</p>
    <div class="field-grid g1 mb-section"><div class="pf-field"><label>Clinic Name</label><span class="p-input-icon-left w-full"><i class="pi pi-building"></i><input pInputText class="w-full" [value]="clinicData.clinicName" disabled /></span></div></div>
    <p class="section-label">Treatment Info</p>
    <div class="field-grid g3 mb-section">
      <div class="pf-field"><label>Treatment Name <span class="req">*</span></label><span class="p-input-icon-left w-full"><i class="pi pi-heart"></i><input pInputText formControlName="name" placeholder="Treatment name" class="w-full" /></span><small class="p-error" *ngIf="f['name'].touched && f['name'].errors?.['required']">Treatment name is required.</small></div>
      <div class="pf-field"><label>Duration (minutes)</label><span class="p-input-icon-left w-full"><i class="pi pi-clock"></i><input pInputText type="number" formControlName="duration" placeholder="Duration" class="w-full" /></span></div>
      <div class="pf-field"><label>Price</label><span class="p-input-icon-left w-full"><i class="pi pi-dollar"></i><input pInputText type="number" formControlName="price" placeholder="Price" class="w-full" /></span></div>
      <div class="pf-field"><label>Status</label><p-dropdown [options]="statuses" optionLabel="label" optionValue="value" formControlName="status" styleClass="w-full"></p-dropdown></div>
    </div>
    <div class="field-grid g1 mb-section"><div class="pf-field"><label>Description</label><textarea pInputTextarea rows="4" formControlName="description" class="w-full"></textarea></div></div>
    <small class="p-error" *ngIf="error">{{ error }}</small>
    <div class="pf-divider"></div><div class="pf-btn-row"><button pButton type="button" icon="pi pi-times" label="Cancel" class="p-button-sm p-button-secondary" [disabled]="loading" (click)="cancel()"></button><button pButton type="submit" icon="pi pi-check" [label]="isEdit ? 'Update Treatment' : 'Create Treatment'" class="p-button-sm pf-btn-primary" [loading]="loading" [disabled]="form.invalid || loading"></button></div>
  </form>
</div></div></div>
