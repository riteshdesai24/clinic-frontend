<div class="grid">
    <div class="col-12">
        <div class="card">
            <!-- Heading -->
            <h5 class="mb-3">
                {{
                    isUser === "Staff"
                        ? "Create Staff"
                        : isUser === "Doctor"
                          ? "Create Doctor"
                          : "Create User"
                }}
            </h5>

            <form [formGroup]="staffForm" (ngSubmit)="onSubmit()">
                <!-- Clinic Info -->
                <div class="grid mb-3">
                    <div class="col-12 md:col-8">
                        <label class="font-bold block mb-2">
                            Clinic Name
                        </label>

                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            formControlName="clinicName"
                            disabled
                        />
                    </div>
                </div>

                <hr class="mb-3" />

                <!-- User Details -->
                <div class="grid">
                    <!-- Name -->
                    <div class="col-12 md:col-4">
                        <label class="font-bold block mb-2">
                            {{
                                isUser === "Doctor"
                                    ? "Doctor Name"
                                    : "Staff Name"
                            }}
                            <span class="text-red-500">*</span>
                        </label>

                        <span class="p-input-icon-left w-full">
                            <i class="pi pi-user"></i>

                            <input
                                pInputText
                                type="text"
                                class="w-full"
                                formControlName="staffname"
                            />
                        </span>

                        <small
                            class="p-error"
                            *ngIf="
                                f['staffname'].touched && f['staffname'].invalid
                            "
                        >
                            Min 3 characters required
                        </small>
                    </div>

                    <!-- Email -->
                    <div class="col-12 md:col-4">
                        <label class="font-bold block mb-2">
                            {{
                                isUser === "Doctor"
                                    ? "Doctor Email"
                                    : "Staff Email"
                            }}
                            <span class="text-red-500">*</span>
                        </label>

                        <span class="p-input-icon-left w-full">
                            <i class="pi pi-envelope"></i>

                            <input
                                pInputText
                                type="email"
                                class="w-full"
                                formControlName="email"
                            />
                        </span>

                        <small
                            class="p-error"
                            *ngIf="f['email'].touched && f['email'].invalid"
                        >
                            Valid email required
                        </small>
                    </div>

                    <!-- Phone -->
                    <div class="col-12 md:col-4">
                        <label class="font-bold block mb-2">
                            {{
                                isUser === "Doctor"
                                    ? "Doctor Phone"
                                    : "Staff Phone"
                            }}
                            <span class="text-red-500">*</span>
                        </label>

                        <span class="p-input-icon-left w-full">
                            <i class="pi pi-phone"></i>

                            <input
                                pInputText
                                type="text"
                                class="w-full"
                                formControlName="phone"
                            />
                        </span>
                    </div>

                    <!-- Password -->
                    <div class="col-12 md:col-4" *ngIf="!isEdit && !isview">
                        <label class="font-bold block mb-2">
                            Password <span class="text-red-500">*</span>
                        </label>

                        <p-password
                            formControlName="password"
                            [toggleMask]="true"
                            styleClass="w-full"
                            inputStyleClass="w-full"
                        >
                        </p-password>
                    </div>

                    <!-- Role -->
                    <div class="col-12 md:col-4">
                        <label class="font-bold block mb-2">
                            Role <span class="text-red-500">*</span>
                        </label>

                        <p-dropdown
                            [options]="roles"
                            formControlName="role"
                            placeholder="Select role"
                            styleClass="w-full"
                        >
                        </p-dropdown>
                    </div>

                    <!-- Specialization -->
                    <div
                        class="col-12 md:col-4"
                        *ngIf="f['role'].value === 'DOCTOR'"
                    >
                        <label class="font-bold block mb-2">
                            Specialization <span class="text-red-500">*</span>
                        </label>

                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            formControlName="specialization"
                        />

                        <small
                            class="p-error"
                            *ngIf="
                                f['specialization'].touched &&
                                f['specialization'].invalid
                            "
                        >
                            Specialization required
                        </small>
                    </div>
                </div>

                <!-- Messages -->
                <div class="mt-3">
                    <small class="p-error" *ngIf="error">
                        {{ error }}
                    </small>

                    <small class="p-success" *ngIf="success">
                        {{ success }}
                    </small>
                </div>

                <!-- Buttons -->
                <div class="flex justify-content-end gap-2 mt-4">
                    <button
                        pButton
                        type="submit"
                        label="Create"
                        icon="pi pi-check"
                        class="p-button-sm"
                        [loading]="loading"
                        [disabled]="staffForm.invalid || loading"
                    ></button>

                    <button
                        pButton
                        type="button"
                        label="Cancel"
                        icon="pi pi-times"
                        class="p-button-sm p-button-secondary"
                        (click)="onCancel()"
                    ></button>
                </div>
            </form>
        </div>
    </div>
</div>
