<div class="grid"><div class="col-12"><div class="condition-list-card">
  <div class="header"><div><h5>{{ title }}</h5><p>{{ filteredConditions.length }} conditions found</p></div><button pButton icon="pi pi-plus" label="Add Condition" (click)="addCondition()"></button></div>
  <span class="p-input-icon-left search"><i class="pi pi-search"></i><input pInputText placeholder="Search conditions..." (input)="search($event)" /></span>
  <p-table [value]="filteredConditions" [loading]="loading" [paginator]="true" [rows]="10" responsiveLayout="scroll">
    <ng-template pTemplate="header"><tr><th>Condition</th><th>Description</th><th>Status</th><th class="actions-heading">Actions</th></tr></ng-template>
    <ng-template pTemplate="body" let-condition><tr><td><strong>{{ condition.name }}</strong></td><td>{{ condition.description || '—' }}</td><td><span class="status">{{ condition.status || 'ACTIVE' }}</span></td><td class="actions"><button pButton icon="pi pi-pencil" class="p-button-text" pTooltip="Edit" (click)="editCondition(condition)"></button><button pButton icon="pi pi-trash" class="p-button-text p-button-danger" pTooltip="Delete" (click)="deleteCondition(condition)"></button></td></tr></ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="4" class="empty">No conditions found. Add your first condition to get started.</td></tr></ng-template>
  </p-table>
</div></div></div>
