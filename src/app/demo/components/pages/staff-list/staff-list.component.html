<div class="grid">
  <div class="col-12">
    <div class="pl-card">

      <!-- Header -->
      <div class="pl-header">
        <div class="pl-header-left">
          <div class="pl-icon">
            <i class="pi pi-users"></i>
          </div>
          <div>
            <h5 class="pl-title">Staff List</h5>
            <p class="pl-sub">{{ filteredStaffList.length }} staff members found</p>
          </div>
        </div>
        <button
          pButton
          icon="pi pi-plus"
          label="Add Staff"
          class="pl-add-btn"
          (click)="createNewStaff()">
        </button>
      </div>

      <!-- Search -->
      <div class="pl-search-wrap">
        <span class="p-input-icon-left pl-search">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (input)="onStaffSearch($event)"
            placeholder="Search by name, phone or email..." />
        </span>
      </div>

      <!-- Table -->
      <p-table
        [value]="filteredStaffList"
        [loading]="loading"
        responsiveLayout="scroll"
        [paginator]="true"
        [rows]="10"
        styleClass="pl-table">

        <!-- Header -->
        <ng-template pTemplate="header">
          <tr>
            <th>Staff</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Role</th>
            <th class="text-right">Actions</th>
          </tr>
        </ng-template>

        <!-- Body -->
        <ng-template pTemplate="body" let-staff>
          <tr>
            <td>
              <div class="patient-cell">
                <div class="patient-avatar">
                  {{ staff.staffname?.charAt(0) }}
                </div>
                <div>
                  <p class="patient-name">{{ staff.staffname }}</p>
                  <p class="patient-age">{{ staff.email }}</p>
                </div>
              </div>
            </td>
            <td>
              <span class="cell-text">
                <i class="pi pi-phone cell-icon"></i> {{ staff.phone }}
              </span>
            </td>
            <td>
              <span class="cell-text">{{ staff.email || '—' }}</span>
            </td>
            <td>
              <span class="spec-badge">
                {{ staff.role }}
              </span>
            </td>
            <td>
              <div class="action-row">
                <button
                  pButton
                  icon="pi pi-eye"
                  class="action-btn action-view"
                  pTooltip="View"
                  (click)="viewStaff(staff)">
                </button>
                <button
                  pButton
                  icon="pi pi-pencil"
                  class="action-btn action-edit"
                  pTooltip="Edit"
                  (click)="editStaff(staff)">
                </button>
                <button
                  pButton
                  icon="pi pi-trash"
                  class="action-btn action-delete"
                  pTooltip="Delete"
                  (click)="deleteStaff(staff)">
                </button>
              </div>
            </td>
          </tr>
        </ng-template>

        <!-- Empty -->
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <i class="pi pi-users"></i>
                <p>No staff found</p>
                <span>Try adjusting your search or add a new staff member</span>
              </div>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </div>
  </div>

  <p-confirmDialog></p-confirmDialog>
  <p-toast></p-toast>
</div>
