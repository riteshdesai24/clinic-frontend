<div class="grid">
  <div class="col-12">

    <div class="card">

      <!-- Header -->
      <div class="flex justify-content-between align-items-center mb-4">

        <h5>Patient List</h5>

        <button
          pButton
          icon="pi pi-plus"
          class="p-button-rounded p-button-success"
          (click)="createPatient()"
          pTooltip="Add Patient">
        </button>

      </div>

      <!-- Table -->
      <p-table
        [value]="filteredPatientList"
        [loading]="loading"
        responsiveLayout="scroll"
        [paginator]="true"
        [rows]="10">

        <!-- Search -->
        <ng-template pTemplate="caption">

          <span class="p-input-icon-left">

            <i class="pi pi-search"></i>

            <input
              pInputText
              type="text"
              (input)="onSearch($event)"
              placeholder="Search patients..." />

          </span>

        </ng-template>

        <!-- Header -->
        <ng-template pTemplate="header">

          <tr>

            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Gender</th>
            <th>Actions</th>

          </tr>

        </ng-template>

        <!-- Body -->
        <ng-template pTemplate="body" let-p>

          <tr>

            <td>
              {{ p.firstName }} {{ p.lastName }}
            </td>

            <td>{{ p.phone }}</td>

            <td>{{ p.email || '-' }}</td>

            <td>{{ p.gender }}</td>

            <td>

              <button
                pButton
                icon="pi pi-eye"
                class="p-button-rounded p-button-warning mr-2"
                (click)="viewPatient(p)">
              </button>

              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-info mr-2"
                (click)="editPatient(p)">
              </button>

              <button
                pButton
                icon="pi pi-trash"
                class="p-button-rounded p-button-danger"
                (click)="deletePatient(p)">
              </button>

            </td>

          </tr>

        </ng-template>

        <!-- Empty -->
        <ng-template pTemplate="emptymessage">

          <tr>
            <td colspan="5" class="text-center">
              No patients found
            </td>
          </tr>

        </ng-template>

      </p-table>

    </div>

  </div>
</div>
