<div class="grid">
  <div class="col-12">
    <div class="il-card">
      <div class="il-header">
        <div class="il-header-left">
          <div class="il-icon">
            <i class="pi pi-map"></i>
          </div>
          <div>
            <h5 class="il-title">State List</h5>
            <p class="il-sub">{{ filteredStateList.length }} records found</p>
          </div>
        </div>
        <div class="il-header-right">
          <p-fileUpload
            mode="basic"
            name="stateExcel"
            accept=".xlsx,.xls"
            chooseLabel="Import Excel"
            [auto]="true"
            [showUploadButton]="false"
            [showCancelButton]="false"
            (onSelect)="onFileSelect($event)">
          </p-fileUpload>
          <button
            pButton
            icon="pi pi-plus"
            label="Add State"
            class="il-add-btn"
            (click)="createState()">
          </button>
        </div>
      </div>

      <div class="il-search-wrap">
        <span class="p-input-icon-left il-search">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (input)="onSearch($event)"
            placeholder="Search by state, code or country..." />
        </span>
      </div>

      <p-table
        [value]="filteredStateList"
        [loading]="loading"
        responsiveLayout="scroll"
        [paginator]="true"
        [rows]="10"
        styleClass="il-table">

        <ng-template pTemplate="header">
          <tr>
            <th>State</th>
            <th>Code</th>
            <th>Country</th>
            <th>Status</th>
            <th class="text-right">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
          <tr>
            <td>{{ item.stateName }}</td>
            <td>{{ item.stateCode }}</td>
            <td>{{ item.country }}</td>
            <td>
              <span class="status-badge" [ngClass]="'status-' + (item.status || 'ACTIVE').toLowerCase()">
                {{ item.status || 'ACTIVE' }}
              </span>
            </td>
            <td>
              <div class="action-row">
                <button
                  pButton
                  icon="pi pi-eye"
                  class="action-btn action-view"
                  pTooltip="View"
                  (click)="viewState(item)">
                </button>
                <button
                  pButton
                  icon="pi pi-pencil"
                  class="action-btn action-edit"
                  pTooltip="Edit"
                  (click)="editState(item)">
                </button>
                <button
                  pButton
                  icon="pi pi-trash"
                  class="action-btn action-delete"
                  pTooltip="Delete"
                  (click)="deleteState(item)">
                </button>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <i class="pi pi-map"></i>
                <p>No state records found</p>
                <span>Upload an Excel file or add a new state.</span>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
