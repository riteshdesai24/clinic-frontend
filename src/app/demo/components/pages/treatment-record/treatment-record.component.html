<div class="grid">
  <div class="col-12">
    <section class="record-card">
      <header><div class="record-icon"><i class="pi pi-file-edit"></i></div><div><h2>Record treatment</h2><p>Save a diagnosis and treatment details for an appointment.</p></div></header>

      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="field-grid">
          <div class="field">
            <label for="appointment">Appointment <span class="required">*</span></label>
            <p-dropdown inputId="appointment" [options]="appointments" formControlName="appointmentId" optionLabel="label" optionValue="value" placeholder="Select an appointment" styleClass="w-full"></p-dropdown>
          </div>
          <div class="field">
            <label for="diagnosis">Diagnosis <span class="required">*</span></label>
            <input pInputText id="diagnosis" formControlName="diagnosis" />
          </div>
          <div class="field">
            <label for="treatmentMaster">Billable treatment <span class="required">*</span></label>
            <p-dropdown inputId="treatmentMaster" [options]="treatmentMasters" formControlName="treatmentMasterId" optionLabel="label" optionValue="_id" placeholder="Select a priced treatment" styleClass="w-full"></p-dropdown>
            <small class="field-hint" *ngIf="treatmentMastersLoading">Loading available treatments…</small>
            <small class="field-hint" *ngIf="!treatmentMastersLoading && !treatmentMasters.length">Add an active treatment with a price before issuing an invoice.</small>
          </div>
          <div class="field">
            <label for="followUpDate">Follow-up date</label>
            <p-calendar inputId="followUpDate" formControlName="followUpDate" [showIcon]="true" dateFormat="dd/mm/yy" styleClass="w-full" inputStyleClass="w-full"></p-calendar>
          </div>
        </div>

        <div class="medicine-heading"><h3>Medicines</h3><button pButton type="button" label="Add medicine" icon="pi pi-plus" class="p-button-outlined" (click)="addMedicine()"></button></div>
        <div formArrayName="medicines" class="medicine-list">
          <div class="medicine-row" *ngFor="let medicine of medicines.controls; let index = index" [formGroupName]="index">
            <input pInputText formControlName="name" placeholder="Medicine name" aria-label="Medicine name" />
            <input pInputText formControlName="dosage" placeholder="Dosage" aria-label="Dosage" />
            <input pInputText formControlName="frequency" placeholder="Frequency" aria-label="Frequency" />
            <input pInputText formControlName="duration" placeholder="Duration" aria-label="Duration" />
            <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-danger" aria-label="Remove medicine" (click)="removeMedicine(index)"></button>
          </div>
        </div>

        <div class="field notes-field"><label for="notes">Notes</label><textarea pInputTextarea id="notes" rows="4" formControlName="notes"></textarea></div>
        <div class="invoice-retry" *ngIf="invoiceError" role="alert">
          <span>{{ invoiceError }}</span>
          <button pButton type="button" label="Retry invoice" icon="pi pi-refresh" (click)="issueInvoice()" [loading]="savingInvoice"></button>
        </div>
        <p class="invoice-progress" *ngIf="savingInvoice"><i class="pi pi-spin pi-spinner"></i> Issuing invoice from the treatment price…</p>
        <div class="actions">
          <button pButton type="button" label="Cancel" class="p-button-secondary" (click)="cancel()" [disabled]="saving || savingInvoice"></button>
          <button pButton *ngIf="!treatmentSaved" type="submit" label="Save treatment and issue invoice" icon="pi pi-check" [loading]="saving" [disabled]="saving || loading || treatmentMastersLoading || !treatmentMasters.length"></button>
        </div>
      </form>
    </section>
  </div>
</div>
