<div class="calendar-page">
    <header class="calendar-page-heading">
        <button type="button" class="calendar-back-button" routerLink="/pages/appointment-list" aria-label="Back to appointments">
            <i class="pi pi-arrow-left"></i>
        </button>
        <div>
            <h1>Appointment Calendar</h1>
            <p>View and manage appointments in calendar view.</p>
        </div>
    </header>

    <section class="calendar-card">
        <div class="calendar-card-heading">
            <h2>Calendar</h2>
            <div class="calendar-date-navigation" aria-label="Calendar date navigation">
                <button type="button" (click)="goToToday()">Today</button>
                <button type="button" class="calendar-icon-button" (click)="moveCalendar(-1)" aria-label="Previous date range"><i class="pi pi-chevron-left"></i></button>
                <button type="button" class="calendar-icon-button" (click)="moveCalendar(1)" aria-label="Next date range"><i class="pi pi-chevron-right"></i></button>
                <strong>{{ calendarTitle }}</strong>
            </div>
        </div>

        <div class="calendar-controls">
            <div class="calendar-view-toggle" role="group" aria-label="Calendar view">
                <button type="button" [class.active]="activeView === 'timeGridDay'" (click)="setCalendarView('timeGridDay')">Day</button>
                <button type="button" [class.active]="activeView === 'timeGridWeek'" (click)="setCalendarView('timeGridWeek')">Week</button>
                <button type="button" [class.active]="activeView === 'dayGridMonth'" (click)="setCalendarView('dayGridMonth')">Month</button>
            </div>
            <div class="calendar-filter-actions">
                <select aria-label="Filter appointments by doctor" [value]="activeDoctorId" (change)="setDoctorFilter($any($event.target).value)">
                    <option value="">All Doctors</option>
                    <option *ngFor="let doctor of doctorOptions" [value]="doctor.value">{{ doctor.label }}</option>
                </select>
                <button type="button" class="calendar-new-button" (click)="openNewAppointment()"><i class="pi pi-plus"></i> New</button>
            </div>
        </div>

        <p *ngIf="calendarLoadError" class="calendar-error" role="alert">{{ calendarLoadError }}</p>

        <div class="calendar-wrapper">
            <full-calendar #calendar [options]="calendarOptions"></full-calendar>
        </div>
    </section>
</div>
