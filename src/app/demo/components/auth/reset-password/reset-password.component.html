<div class="auth-bg flex align-items-center justify-content-center min-h-screen">

  <div class="auth-card">

    <!-- LOGO -->
    <div class="text-center mb-4">
      <img src="assets/layout/images/logo-dark.svg" class="logo" />
    </div>

    <!-- HEADER -->
    <div class="text-center mb-4">
      <h2 class="auth-title">Reset Password 🔐</h2>
      <p class="auth-subtitle">Enter your new password</p>
    </div>

    <!-- FORM -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">

      <!-- PASSWORD -->
      <div class="field">
        <label>New Password</label>
        <p-password
          formControlName="password"
          placeholder="Enter new password"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="full-input"
          inputStyleClass="full-input">
        </p-password>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="field">
        <label>Confirm Password</label>
        <p-password
          formControlName="confirmPassword"
          placeholder="Confirm password"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="full-input"
          inputStyleClass="full-input">
        </p-password>
      </div>

      <!-- ERROR -->
      <div *ngIf="error" class="error-text text-center">
        {{ error }}
      </div>

      <!-- SUCCESS -->
      <div *ngIf="message" class="success-text text-center">
        {{ message }}
      </div>

      <!-- BUTTON -->
      <button pButton
              type="submit"
              class="full-btn p-button-primary p-button-lg"
              [disabled]="form.invalid || loading">

        <span *ngIf="!loading">Reset Password</span>
        <span *ngIf="loading">Resetting...</span>
      </button>

    </form>

  </div>
</div>
