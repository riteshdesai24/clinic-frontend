<div class="sa-auth-wrap">
  <section class="sa-auth-card">
    <a routerLink="/auth/login" class="sa-back"><i class="pi pi-arrow-left"></i> Clinic app</a>
    <div class="sa-mark"><i class="pi pi-shield"></i></div>
    <p class="sa-eyebrow">CLINIC PLATFORM</p>
    <h1>Super admin sign in</h1>
    <p class="sa-subtitle">Sign in to manage clinics and platform settings.</p>
    <p class="sa-auth-success" *ngIf="registered">Super admin registered. Sign in to continue.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email address<input pInputText type="email" formControlName="email" autocomplete="email" /></label>
      <label>Password<input pInputText type="password" formControlName="password" autocomplete="current-password" /></label>
      <p class="sa-error" *ngIf="error">{{ error }}</p>
      <button pButton type="submit" [disabled]="loading" [label]="loading ? 'Please wait…' : 'Sign in'"></button>
    </form>
    <p class="sa-switch">Need an account? <a routerLink="/superadmin/register">Create a super admin account</a></p>
  </section>
</div>
