<div class="layout-topbar">
    <a class="layout-topbar-logo">
        <img *ngIf="clinicLogo" class="clinic-nav-logo" [src]="clinicLogo" [alt]="clinicName + ' logo'">
        <span *ngIf="!clinicLogo">{{clinicName}}</span>
    </a>
    <button #menubutton class="p-link layout-menu-button layout-topbar-button" aria-label="Toggle navigation"
        (click)="layoutService.onMenuToggle()">
        <i class="pi pi-bars"></i>
    </button>

    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
        (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <div #topbarmenu class="layout-topbar-menu"
        [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <button class="p-link layout-topbar-button" (click)="menu.toggle($event)">
            <i class="pi pi-user"></i>
            <span>Profile</span>
        </button>
        <p-menu #menu [popup]="true" [model]="menuItems"></p-menu>
    </div>
</div>
